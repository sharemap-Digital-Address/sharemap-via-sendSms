<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareMap - Send via SMS</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      max-width: 400px; 
      margin: auto; 
      background-color: #f4f7f6;
    }
    .card { 
      background: #ffffff;
      border: 1px solid #ccc; 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }
    input { 
      width: 100%; 
      padding: 10px; 
      margin-top: 5px; 
      box-sizing: border-box; 
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    button { 
      width: 100%;
      padding: 12px; 
      margin-top: 15px; 
      background-color: #28a745; 
      color: white; 
      border: none; 
      font-weight: bold; 
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer; 
    }
    button:disabled { 
      background-color: #888; 
    }
    #status { 
      font-size: 0.9em; 
      color: #0275d8; 
      margin-top: 12px; 
      text-align: center; 
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
  <h2 style="text-align: center; margin-top: 0;">📍 ShareMap via SMS</h2>
  
  <label for="sellerNum">Cellphone Number ng Seller/Rider:</label>
  <input type="tel" id="sellerNum" placeholder="09123456789" value="09123456789">

  <label for="buyerName">Pangalan Mo:</label>
  <input type="text" id="buyerName" placeholder="hal. Juan Cruz">

  <label for="landmark">Landmark / Katabi:</label>
  <input type="text" id="landmark" placeholder="hal. Katabi ng Pulang Gate">

  <button id="sendBtn" onclick="generateAndSendSMS()">📱 GENERATE & SEND SMS</button>
  <p id="status"></p>
</div>

<script>
  const ALPHABET = "23456789CFGHJMPQRVWX";

  // SUBO'T TUPAK NA STANDARD PLUS CODE ALGORITHM (100% MATCH)
  function encodeStandardPlusCode(lat, lng) {
    lat = Math.min(Math.max(lat, -90), 90);
    lng = ((lng + 180) % 360 + 360) % 360 - 180;
    if (lat === 90) lat = 89.999999;

    let latVal = lat + 90;
    let lngVal = lng + 180;
    let code = "";

    let latPlace = 20;
    let lngPlace = 20;

    // Unang 8 characters (4 pairs)
    for (let i = 0; i < 4; i++) {
      let d1 = Math.floor(latVal / latPlace);
      let d2 = Math.floor(lngVal / lngPlace);
      latVal -= d1 * latPlace;
      lngVal -= d2 * lngPlace;
      code += ALPHABET.charAt(d1) + ALPHABET.charAt(d2);
      
      latPlace /= 20;
      lngPlace /= 20;
    }

    // Ilalagay ang '+' sign eksakto pagkatapos ng 8th character
    code += "+";

    // Huling 2 characters (5th pair) para sa eksaktong pwesto
    let d1 = Math.floor(latVal / latPlace);
    let d2 = Math.floor(lngVal / lngPlace);
    code += ALPHABET.charAt(d1) + ALPHABET.charAt(d2);

    return code;
  }

  function generateAndSendSMS() {
    const btn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    const phone = document.getElementById('sellerNum').value.trim();
    const name = document.getElementById('buyerName').value.trim();
    const landmark = document.getElementById('landmark').value.trim();

    if (!phone) {
      alert("Paki-lagay ang cellphone number ng Seller o Rider!");
      return;
    }

    btn.disabled = true;
    status.innerText = "🔍 Kumukuha ng GPS location...";

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const latFixed = lat.toFixed(5);
          const lngFixed = lng.toFixed(5);

          // Tumpak na pagkuha ng Plus Code
          const plusCode = encodeStandardPlusCode(lat, lng);

          status.innerText = "📱 Binubuksan ang Messaging App...";

          // Format ng SMS (Pure text lang para iwas harang sa Telco)
          const smsText = `SHAREMAP DIGITAL ADDRESS\n\n` +
                          `Pangalan: ${name || 'N/A'}\n` +
                          `Landmark: ${landmark || 'N/A'}\n\n` +
                          `Plus Code:\n` +
                          `${plusCode}\n\n` +
                          `GPS Location:\n` +
                          `${latFixed}, ${lngFixed}`;

          const encodedText = encodeURIComponent(smsText);
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          const delimiter = isIOS ? '&' : '?';

          const smsUri = `sms:${phone}${delimiter}body=${encodedText}`;

          window.location.href = smsUri;

          btn.disabled = false;
          status.innerText = "✅ Nabuhat na ang SMS!";
        },
        (error) => {
          alert("Siguraduhing naka-ON ang GPS sa notification bar ng phone mo.");
          btn.disabled = false;
          status.innerText = "❌ Nabigo ang pagkuha ng GPS.";
        },
        { enableHighAccuracy: false, timeout: 5000, maximumAge: Infinity }
      );
    } else {
      alert("Hindi suportado ng browser mo ang GPS location.");
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
